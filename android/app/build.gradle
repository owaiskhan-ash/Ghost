plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.ghost.agent'
    compileSdk 34

    defaultConfig {
        applicationId "ai.ghost.agent"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
